<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Chatroom - Quillora</title>
  <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <header class="main-header">
      <div class="logo">
        Quillora
        <span class="logo-subtext">Love Bibliophile</span>
      </div>
      <nav class="main-nav">
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="explore.html">EXPLORE</a>
        <a href="read.html">READ</a>
        <a href="write.html">WRITE</a>
        <a href="chatrooms.html" class="active">CHATROOMS</a>
        <a href="/signup">JOIN/SIGNUP</a>
        <a href="/profile" class="lang-link">MY PROFILE</a>
      </nav>
    </header>
    <section class="chatroom-join-section">
      <div class="chatroom-join-left">
        <div class="chatroom-logo">Quillora</div>
        <h1>Join <span class="italic">Quillora Chatroom</span></h1>
        <p class="offers-caption">Our available chat spaces</p>
      </div>
      <div class="chatroom-join-right">
        <h2>Submit a request to join</h2>
        <form class="chatroom-join-form">
          <input type="text" placeholder="User Name" required>
          <input type="email" placeholder="Email_id" required>
          <input type="text" placeholder="Password" required>
          <div class="form-row">
            <input type="checkbox" id="accept" required>
            <label for="accept"><span style="color:black">I accept the </span><a href="#" style="color: #888;">Community Guidelines</a><span style="color:black"> and </span><a href="#"style="color: #888;">Privacy Policy</a>.</label>
          </div>
          <button type="submit" class="submit-btn">JOIN THE CHATROOM</button>
        </form>
      </div>
    </section>
</body>
</html>
